[metadata]
name = pact-el
version = 0.1.0
description = PACT-EL/GAVEL: guarantee-aware prompt contract repair with executable logic and canary falsification.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT

[options]
packages = find:
python_requires = >=3.9
install_requires =
    jsonschema>=4.20,<5
    networkx>=3.2,<4
    pydantic>=2.6,<3
    typing-extensions>=4.8

[options.extras_require]
dev =
    pytest>=8
    pytest-asyncio>=0.23
litellm =
    litellm>=1.40
baselines =
    dspy[optuna]>=3.2,<4; python_version >= "3.10"

[options.packages.find]
include = pact_el*
